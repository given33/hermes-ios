name: Build signed production iOS IPA

run-name: Backend release signed ${{ github.event.client_payload.commit || github.sha }}

on:
  # Signed EAS is intentionally opt-in. Unsigned IPA builds run on source
  # pushes; signed builds require explicit credentials and are started by a
  # backend release dispatch or a manual operator run.
  workflow_dispatch:
  repository_dispatch:
    types:
      - hermes-backend-release

permissions:
  contents: write
  actions: read

concurrency:
  group: ios-production-${{ github.event.client_payload.commit || github.sha }}
  cancel-in-progress: false

jobs:
  dedupe:
    name: Deduplicate backend release dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.decision_default.outputs.should_build }}
    steps:
      - name: Check for an existing successful signed build
        id: decision
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_COMMIT: ${{ github.event.client_payload.commit || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'repository_dispatch commit must be a 40-character lowercase SHA.' >&2
            exit 1
          }
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=repository_dispatch&per_page=100")"
          successful="$(jq -r \
            --arg commit "$BACKEND_COMMIT" \
            --arg run_id "$GITHUB_RUN_ID" \
            '[.workflow_runs[]
              | select((.id | tostring) != $run_id)
              | select(.display_title == ("Backend release signed " + $commit))
              | select(.status == "completed" and .conclusion == "success")]
              | length' <<<"$runs")"
          if [ "$successful" -gt 0 ]; then
            echo "A successful signed build already exists for backend commit $BACKEND_COMMIT; skipping duplicate dispatch."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build non-dispatch events
        id: non_dispatch
        if: github.event_name != 'repository_dispatch'
        run: echo 'should_build=true' >> "$GITHUB_OUTPUT"
      - name: Publish the build decision
        id: decision_default
        run: |
          if [ -n "${{ steps.decision.outputs.should_build }}" ]; then
            echo "should_build=${{ steps.decision.outputs.should_build }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=${{ steps.non_dispatch.outputs.should_build }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: dedupe
    if: needs.dedupe.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_FRONTEND_PREVIEW: '0'
      EXPO_PUBLIC_HERMES_URL: 'https://daxueshenmai.top'
      HERMES_DISTRIBUTABLE_BUILD: '1'
      HERMES_AMAP_IOS_API_KEY: ${{ secrets.HERMES_AMAP_IOS_API_KEY }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      HERMES_CI_BUILD_NUMBER: ${{ github.run_id }}
      BACKEND_COMMIT: ${{ github.event.client_payload.commit || '' }}
      BACKEND_VERSION: ${{ github.event.client_payload.version || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate backend release event
        if: github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'repository_dispatch commit must be a 40-character lowercase SHA.' >&2
            exit 1
          }
          [[ "$BACKEND_VERSION" =~ ^[0-9A-Za-z.+_-]+$ ]] || {
            echo 'repository_dispatch version contains unsupported characters.' >&2
            exit 1
          }
      - name: Require Expo credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN is required for a signed production EAS build.' >&2
            exit 1
          fi
          if [[ ! "$EXPO_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo 'EXPO_PROJECT_ID must be the UUID of the already initialized EAS project.' >&2
            exit 1
          fi
          if [[ ! "$HERMES_CI_BUILD_NUMBER" =~ ^[1-9][0-9]{0,17}$ ]]; then
            echo 'HERMES_CI_BUILD_NUMBER must be a positive iOS build number with at most 18 digits.' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies with network retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::pnpm install attempt ${attempt}/3 failed" >&2
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec expo config --type public
      - name: Verify the production source graph
        run: node scripts/verify-production-source-graph.mjs .
      - name: Build and wait for the signed production IPA
        shell: bash
        run: |
          set -euo pipefail
          message="github:${GITHUB_SHA}"
          if [ -n "$BACKEND_COMMIT" ]; then
            message="$message backend:$BACKEND_COMMIT version:$BACKEND_VERSION"
          fi
          npx --yes eas-cli@20.5.1 build \
            --platform ios \
            --profile production \
            --message "$message" \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/eas-build.json"
      - name: Verify EAS build result
        shell: bash
        env:
          EAS_OUTPUT: ${{ runner.temp }}/eas-build.json
          EAS_OUTPUT_URL: ${{ runner.temp }}/eas-build-url
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const raw = readFileSync(process.env.EAS_OUTPUT, 'utf8');
          const values = [raw.trim(), ...raw.split(/\r?\n/)].flatMap((value) => {
            try { return [JSON.parse(value)]; } catch { return []; }
          });
          const flattened = values.flatMap((value) => Array.isArray(value) ? value : [value]);
          const build = flattened.find((value) => value && typeof value === 'object' && (
            value.artifacts?.buildUrl || value.artifacts?.applicationArchiveUrl || value.buildUrl
          ));
          if (!build) throw new Error('EAS JSON did not contain a completed build artifact URL.');
          const status = String(build.status || '').toUpperCase();
          if (status && !['FINISHED', 'SUCCEEDED'].includes(status)) {
            throw new Error(`EAS build finished with unexpected status: ${status}`);
          }
          const expectedVersion = JSON.parse(readFileSync('app.base.json', 'utf8')).expo?.version;
          if (typeof expectedVersion !== 'string' || build.appVersion !== expectedVersion) {
            throw new Error(`EAS app version mismatch: expected ${expectedVersion}, got ${build.appVersion}`);
          }
          const sourceCommit = build.gitCommitHash || build.gitCommit;
          if (sourceCommit !== process.env.GITHUB_SHA) {
            throw new Error(`EAS source commit mismatch: expected ${process.env.GITHUB_SHA}, got ${sourceCommit}`);
          }
          if (!/^[1-9][0-9]*$/.test(String(build.appBuildVersion || ''))) {
            throw new Error(`EAS build number is invalid: ${build.appBuildVersion}`);
          }
          if (String(build.appBuildVersion) !== process.env.HERMES_CI_BUILD_NUMBER) {
            throw new Error(
              `EAS build number mismatch: expected ${process.env.HERMES_CI_BUILD_NUMBER}, got ${build.appBuildVersion}`,
            );
          }
          const artifactUrl = build.artifacts?.buildUrl || build.artifacts?.applicationArchiveUrl || build.buildUrl;
          if (!/^https:\/\//.test(String(artifactUrl))) {
            throw new Error('EAS build artifact URL is not an HTTPS URL.');
          }
          writeFileSync(process.env.EAS_OUTPUT_URL, String(artifactUrl));
          console.log(`Verified signed production EAS artifact: ${artifactUrl}`);
          NODE
      - name: Download and verify the signed IPA
        shell: bash
        env:
          EAS_OUTPUT_URL: ${{ runner.temp }}/eas-build-url
        run: |
          set -euo pipefail
          artifact_url="$(cat "$EAS_OUTPUT_URL")"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            "$artifact_url" \
            --output "$RUNNER_TEMP/Hermes-Agent-production.ipa"
          test -s "$RUNNER_TEMP/Hermes-Agent-production.ipa"
          unzip -t "$RUNNER_TEMP/Hermes-Agent-production.ipa"
          rm -rf "$RUNNER_TEMP/production-ipa"
          mkdir -p "$RUNNER_TEMP/production-ipa"
          unzip -q "$RUNNER_TEMP/Hermes-Agent-production.ipa" -d "$RUNNER_TEMP/production-ipa"
          APP_PATH="$(find "$RUNNER_TEMP/production-ipa/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          verify_signed_bundle() {
            local bundle="$1"
            local relative_bundle="${bundle#$APP_PATH/}"
            local bundle_identifier
            local team_identifier
            local profile_plist
            local profile_application_identifier
            local profile_team_identifier
            test -s "$bundle/embedded.mobileprovision"
            codesign --verify --strict --verbose=2 "$bundle"
            bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")"
            test -n "$bundle_identifier"
            team_identifier="$(codesign -d --verbose=4 "$bundle" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -n 1)"
            test -n "$team_identifier"
            profile_plist="$RUNNER_TEMP/profile-$(printf '%s' "$relative_bundle" | shasum -a 256 | awk '{print $1}').plist"
            security cms -D -i "$bundle/embedded.mobileprovision" -o "$profile_plist"
            profile_application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
            test "$profile_application_identifier" = "$team_identifier.$bundle_identifier"
            profile_team_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$profile_plist")"
            test "$profile_team_identifier" = "$team_identifier"
            echo "Verified signed bundle $relative_bundle ($bundle_identifier, team $team_identifier)."
          }
          while IFS= read -r signed_bundle; do
            verify_signed_bundle "$signed_bundle"
          done < <(find "$APP_PATH" -type d \( -name '*.app' -o -name '*.appex' \) -print | sort)
          APP_BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          EXPECTED_BUNDLE_IDENTIFIER="$(node -p "require('./app.base.json').expo.ios.bundleIdentifier")"
          test "$APP_BUNDLE_IDENTIFIER" = "$EXPECTED_BUNDLE_IDENTIFIER"
          node scripts/verify-production-app.mjs "$APP_PATH"
          shasum -a 256 "$RUNNER_TEMP/Hermes-Agent-production.ipa" \
            | awk '{print $1 "  Hermes-Agent-production.ipa"}' \
            > "$RUNNER_TEMP/Hermes-Agent-production.ipa.sha256"
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const raw = readFileSync(process.env.RUNNER_TEMP + '/eas-build.json', 'utf8');
          const values = [raw.trim(), ...raw.split(/\r?\n/)].flatMap((value) => {
            try { return [JSON.parse(value)]; } catch { return []; }
          });
          const build = values.flatMap((value) => Array.isArray(value) ? value : [value])
            .find((value) => value && typeof value === 'object' && (
              value.artifacts?.buildUrl || value.artifacts?.applicationArchiveUrl || value.buildUrl
            ));
          if (!build?.id) throw new Error('EAS build metadata is missing the build id.');
          const ipa = readFileSync(process.env.RUNNER_TEMP + '/Hermes-Agent-production.ipa');
          const metadata = {
            schema: 'hermes.ios.production-build.v1',
            trigger: process.env.GITHUB_EVENT_NAME,
            ios_commit: process.env.GITHUB_SHA,
            backend_commit: process.env.BACKEND_COMMIT || null,
            backend_version: process.env.BACKEND_VERSION || null,
            eas_build_id: build.id,
            app_version: build.appVersion,
            app_build_number: String(build.appBuildVersion),
            artifact_sha256: createHash('sha256').update(ipa).digest('hex'),
          };
          writeFileSync(
            process.env.RUNNER_TEMP + '/Hermes-Agent-production-build.json',
            `${JSON.stringify(metadata)}\n`,
          );
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hermes-Agent-production-eas-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/eas-build.json
            ${{ runner.temp }}/Hermes-Agent-production.ipa
            ${{ runner.temp }}/Hermes-Agent-production.ipa.sha256
            ${{ runner.temp }}/Hermes-Agent-production-build.json
      - name: Publish the signed production release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in Hermes-Agent-unsigned.ipa Hermes-Agent-unsigned.ipa.sha256 Hermes-Agent-build.json; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes >/dev/null 2>&1 || true
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/Hermes-Agent-production.ipa" \
              "$RUNNER_TEMP/Hermes-Agent-production.ipa.sha256" \
              "$RUNNER_TEMP/Hermes-Agent-production-build.json" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/Hermes-Agent-production.ipa" \
              "$RUNNER_TEMP/Hermes-Agent-production.ipa.sha256" \
              "$RUNNER_TEMP/Hermes-Agent-production-build.json" \
              --generate-notes \
              --title "Hermes Agent $GITHUB_REF_NAME"
          fi
