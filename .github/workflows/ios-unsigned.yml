name: Build full unsigned iOS IPA

run-name: Backend release ${{ github.event.client_payload.commit || github.sha }}

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - hermes-backend-release
      - hermes-backend-release-unsigned
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.event.client_payload.commit || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_FRONTEND_PREVIEW: '0'
      EXPO_PUBLIC_HERMES_URL: 'https://daxueshenmai.top'
      HERMES_DISTRIBUTABLE_BUILD: '1'
      HERMES_RESIGN_COMPAT_BUILD: '0'
      HERMES_CI_BUILD_NUMBER: ${{ github.run_id }}
      HERMES_AMAP_IOS_API_KEY: ${{ secrets.HERMES_AMAP_IOS_API_KEY }}
      BACKEND_COMMIT: ${{ github.event.client_payload.commit || '' }}
      BACKEND_VERSION: ${{ github.event.client_payload.version || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate backend release event
        if: github.event_name == 'repository_dispatch'
        env:
          BACKEND_COMMIT: ${{ github.event.client_payload.commit }}
          BACKEND_VERSION: ${{ github.event.client_payload.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'repository_dispatch commit must be a 40-character lowercase SHA.' >&2
            exit 1
          }
          [[ "$BACKEND_VERSION" =~ ^[0-9A-Za-z.+_-]+$ ]] || {
            echo 'repository_dispatch version contains unsupported characters.' >&2
            exit 1
          }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Select the native map provider
        shell: bash
        run: |
          if [ -n "$HERMES_AMAP_IOS_API_KEY" ]; then
            echo 'Native AMap is enabled for this build.'
          else
            echo 'No app-bound AMap key is configured; native MapKit fallback is enabled.'
          fi
      - name: Install locked dependencies with network retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::pnpm install attempt ${attempt}/3 failed" >&2
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1
      - run: pnpm doctor
      - run: pnpm test
      - run: pnpm typecheck
      - name: Verify the production source graph
        run: node scripts/verify-production-source-graph.mjs .
      - name: Generate and verify the iOS asset export
        shell: bash
        run: |
          pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/hermes-font-export"
          node scripts/verify-native-font-export.mjs "$RUNNER_TEMP/hermes-font-export"
          node scripts/verify-production-bundle.mjs "$RUNNER_TEMP/hermes-font-export"
      - name: Select Xcode with Swift 6.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Generate the native iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install
      - name: Verify the generated AMap configuration
        shell: bash
        run: |
          MAP_PLIST="$(grep -rl --include='Info.plist' '<key>HermesAmapIOSAPIKey</key>' ios | head -n 1)"
          if [ -z "$MAP_PLIST" ]; then
            echo 'Generated iOS project is missing HermesAmapIOSAPIKey.' >&2
            exit 1
          fi
          GENERATED_KEY="$(plutil -extract HermesAmapIOSAPIKey raw "$MAP_PLIST")"
          GENERATED_MAP_BUNDLE="$(plutil -extract HermesAmapIOSBundleIdentifier raw "$MAP_PLIST")"
          GENERATED_APP_BUNDLE="$(node -p "require('./app.base.json').expo.ios.bundleIdentifier")"
          if [ "$GENERATED_KEY" != "${HERMES_AMAP_IOS_API_KEY:-}" ]; then
            echo 'Generated HermesAmapIOSAPIKey does not match the selected map configuration.' >&2
            exit 1
          fi
          if [ "$GENERATED_MAP_BUNDLE" != "$GENERATED_APP_BUNDLE" ]; then
            echo 'Generated AMap Bundle Identifier does not match CFBundleIdentifier.' >&2
            exit 1
          fi
      - name: Verify the complete extension target graph
        shell: bash
        run: |
          PROJECT_FILE="$(find ios -maxdepth 2 -name project.pbxproj -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo 'Generated Xcode project file was not found.' >&2
            exit 1
          fi
          for target in HermesWeatherWidget HermesWatchApp HermesWatchExtension HermesDeviceActivityMonitor HermesDeviceActivityReport HermesShareExtension HermesFileProvider; do
            if ! grep -q "$target" "$PROJECT_FILE"; then
              echo "Full build is missing required nested target $target." >&2
              exit 1
            fi
          done
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Verify Release entitlement build settings
        shell: bash
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          test -n "$WORKSPACE"
          test -n "$SCHEME"
          resolve_entitlements() {
            local raw="$1"
            raw="${raw#\"}"
            raw="${raw%\"}"
            case "$raw" in
              '$(SRCROOT)'/*) raw="$PWD/ios/${raw#\$\(SRCROOT\)/}" ;;
              /*) ;;
              *) raw="$PWD/ios/$raw" ;;
            esac
            printf '%s\n' "$raw"
          }
          entitlement_setting() {
            awk -F ' = ' '/^[[:space:]]*CODE_SIGN_ENTITLEMENTS = / { print $2; exit }'
          }
          MAIN_SETTING="$(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -showBuildSettings | entitlement_setting)"
          MAIN_ENTITLEMENTS="$(resolve_entitlements "$MAIN_SETTING")"
          test -f "$MAIN_ENTITLEMENTS"
          plutil -lint "$MAIN_ENTITLEMENTS"
          python3 - "$MAIN_ENTITLEMENTS" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              entitlements = plistlib.load(handle)
          expected = {
              "aps-environment": "production",
              "com.apple.developer.family-controls": True,
              "com.apple.developer.healthkit": True,
              "com.apple.developer.healthkit.background-delivery": True,
              "com.apple.security.application-groups": [
                  "group.app.sunstone1029.fig1171.hermes",
              ],
              "keychain-access-groups": [
                  "$(AppIdentifierPrefix)app.sunstone1029.fig1171.hermes.shared",
              ],
          }
          for key, value in expected.items():
              if entitlements.get(key) != value:
                  raise SystemExit(
                      f"Main Release entitlement {key} mismatch: {entitlements.get(key)!r}"
                  )
          PY
          # The Share Extension must reach the SAME keychain group as the main
          # app (shared queue cipher) plus the hermes app group. The extension
          # reads the group via its Info.plist HermesSharedKeychainAccessGroup.
          APPEX_ENTITLEMENTS="$(find ios -name 'HermesShareExtension.entitlements' -print -quit)"
          test -f "$APPEX_ENTITLEMENTS" || { echo 'Share Extension entitlements file not found under ios/.' >&2; exit 1; }
          plutil -lint "$APPEX_ENTITLEMENTS"
          python3 - "$APPEX_ENTITLEMENTS" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              entitlements = plistlib.load(handle)
          groups = entitlements.get("com.apple.security.application-groups") or []
          if "group.app.sunstone1029.fig1171.hermes" not in groups:
              raise SystemExit(f"Share Extension app group mismatch: {groups!r}")
          keychain = entitlements.get("keychain-access-groups") or []
          if "$(AppIdentifierPrefix)app.sunstone1029.fig1171.hermes.shared" not in keychain:
              raise SystemExit(
                  f"Share Extension keychain-access-groups mismatch: {keychain!r}; "
                  "the extension must share the main app's keychain group so the "
                  "sealed trigger queue is readable by both processes"
              )
          PY
          APPEX_INFO="$(dirname "$APPEX_ENTITLEMENTS")/Info.plist"
          test -f "$APPEX_INFO" || { echo 'Share Extension Info.plist not found.' >&2; exit 1; }
          plutil -lint "$APPEX_INFO"
          plutil -extract HermesSharedKeychainAccessGroup raw -o - "$APPEX_INFO" | grep -q 'app.sunstone1029.fig1171.hermes.shared' || {
            echo 'Share Extension Info.plist lacks HermesSharedKeychainAccessGroup.' >&2
            exit 1
          }
      - name: Verify native context autolinking
        run: node scripts/verify-ios-native-context.mjs --ios ios
      - name: Compile without code signing
        shell: bash
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          if [ -z "$WORKSPACE" ] || [ -z "$SCHEME" ]; then
            echo 'Unable to locate the generated Xcode workspace.' >&2
            exit 1
          fi
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/hermes-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO
          node scripts/verify-ios-native-context.mjs \
            --ios ios \
            --derived-data "$RUNNER_TEMP/hermes-build"
      - name: Compile and verify Simulator Release
        shell: bash
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          test -n "$WORKSPACE"
          test -n "$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/hermes-simulator-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO
          SIMULATOR_APP="$(find "$RUNNER_TEMP/hermes-simulator-build/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$SIMULATOR_APP"
          node scripts/verify-production-app.mjs "$SIMULATOR_APP"
      - name: Verify the compiled production app
        shell: bash
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/hermes-build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'The unsigned .app bundle was not produced.' >&2
            exit 1
          fi
          node scripts/verify-production-app.mjs "$APP_PATH"
      - name: Package the IPA
        id: package
        shell: bash
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/hermes-build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'The unsigned .app bundle was not produced.' >&2
            exit 1
          fi
          BUNDLED_AMAP_KEY="$(plutil -extract HermesAmapIOSAPIKey raw "$APP_PATH/Info.plist")"
          BUNDLED_AMAP_BUNDLE="$(plutil -extract HermesAmapIOSBundleIdentifier raw "$APP_PATH/Info.plist")"
          APP_BUNDLE_IDENTIFIER="$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")"
          if [ "$BUNDLED_AMAP_KEY" != "${HERMES_AMAP_IOS_API_KEY:-}" ]; then
            echo 'Compiled app map configuration does not match the build environment.' >&2
            exit 1
          fi
          if [ "$BUNDLED_AMAP_BUNDLE" != "$APP_BUNDLE_IDENTIFIER" ]; then
            echo 'Compiled app AMap Bundle Identifier does not match CFBundleIdentifier.' >&2
            exit 1
          fi
          APP_BUILD_NUMBER="$(plutil -extract CFBundleVersion raw "$APP_PATH/Info.plist")"
          test "$APP_BUILD_NUMBER" = "$HERMES_CI_BUILD_NUMBER"
          test -d "$APP_PATH/PlugIns"
          test -d "$APP_PATH/Watch"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          find "$RUNNER_TEMP/ipa/Payload" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa/Payload" \
            \( -name embedded.mobileprovision -o -name CodeResources \) \
            -type f -delete
          # Xcode can emit prebuilt static/dynamic framework executables as 0644.
          # Remove every embedded Mach-O signature before handing the archive to
          # a third-party signer, then restore executable bits for every bundle.
          while IFS= read -r -d '' plist; do
            executable_name="$(plutil -extract CFBundleExecutable raw "$plist" 2>/dev/null || true)"
            if [ -z "$executable_name" ]; then
              continue
            fi
            executable_path="$(dirname "$plist")/$executable_name"
            if [ -f "$executable_path" ]; then
              if otool -l "$executable_path" 2>/dev/null | grep -q 'cmd LC_CODE_SIGNATURE'; then
                codesign --remove-signature "$executable_path"
              fi
              if otool -l "$executable_path" 2>/dev/null | grep -q 'cmd LC_CODE_SIGNATURE'; then
                echo "Embedded Mach-O signature remains after cleanup: $executable_path" >&2
                exit 1
              fi
              chmod u+x,go+x "$executable_path"
            fi
          done < <(find "$RUNNER_TEMP/ipa/Payload" -type f -name Info.plist -print0)
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/Hermes-Agent-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/Hermes-Agent-unsigned.ipa"
          node "$GITHUB_WORKSPACE/scripts/verify-resignable-ipa.mjs" \
            "$RUNNER_TEMP/Hermes-Agent-unsigned.ipa" \
            --bundle-id "$APP_BUNDLE_IDENTIFIER"
          IPA_SHA256="$(shasum -a 256 "$RUNNER_TEMP/Hermes-Agent-unsigned.ipa" | awk '{print $1}')"
          printf '%s  %s\n' "$IPA_SHA256" 'Hermes-Agent-unsigned.ipa' \
            > "$RUNNER_TEMP/Hermes-Agent-unsigned.ipa.sha256"
          cd "$RUNNER_TEMP"
          shasum -a 256 -c Hermes-Agent-unsigned.ipa.sha256
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ARTIFACT_NAME="Hermes-Agent-full-${APP_BUILD_NUMBER}-${SHORT_SHA}"
          APP_MANIFEST_SHA256="$(shasum -a 256 "$GITHUB_WORKSPACE/app.base.json" | awk '{print $1}')"
          printf '{"build":"%s","commit":"%s","backend_commit":"%s","backend_version":"%s","trigger":"%s","frontend_preview":%s,"resign_compatible":false,"extensions":true,"manifest_sha256":"%s","sha256":"%s"}\n' \
            "$APP_BUILD_NUMBER" \
            "$GITHUB_SHA" \
            "${BACKEND_COMMIT:-}" \
            "${BACKEND_VERSION:-}" \
            "$GITHUB_EVENT_NAME" \
            "$([ "$EXPO_PUBLIC_FRONTEND_PREVIEW" = "1" ] && printf true || printf false)" \
            "$APP_MANIFEST_SHA256" \
            "$IPA_SHA256" \
            > "$RUNNER_TEMP/Hermes-Agent-build.json"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/Hermes-Agent-unsigned.ipa
            ${{ runner.temp }}/Hermes-Agent-unsigned.ipa.sha256
            ${{ runner.temp }}/Hermes-Agent-build.json
